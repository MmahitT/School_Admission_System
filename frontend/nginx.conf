# Serves the React SPA and reverse-proxies the API (service "backend").
upstream api_backend {
    server backend:8080;
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        include /etc/nginx/security-headers.inc;
        return 200 "ok";
    }

    # Documented prefix form: /api/classes -> backend /classes
    location /api/ {
        proxy_pass http://api_backend/;
        include /etc/nginx/security-headers.inc;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Exact spec paths, also reachable on the same host (no SPA route uses these names).
    location ~ ^/(classes|holds|me/holds|health)(/|$) {
        proxy_pass http://api_backend;
        include /etc/nginx/security-headers.inc;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/security-headers.inc;
        try_files $uri =404;
    }

    # SPA history fallback
    location / {
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.inc;
        try_files $uri /index.html;
    }
}
